<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>桌面月历 · 点写清单</title>
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <svg class="lens-defs" aria-hidden="true" focusable="false"><defs id="lens-definitions"></defs></svg>
  <div class="desktop">
    <main class="calendar" data-aria="calendar" aria-label="桌面月历">
      <span class="refracted-edge" aria-hidden="true"></span>
      <header class="toolbar">
        <div class="heading" data-tip="moveWindow">
          <span class="calendar-icon" aria-hidden="true"></span>
          <h1 id="month-label" aria-live="polite">
            <span class="year"><span id="year-value"></span><small>年</small></span>
            <span class="month"><span id="month-value"></span><small>月</small></span>
          </h1>
        </div>
        <div class="control-strip">
          <nav class="month-nav" data-aria="navigate" aria-label="切换月份">
            <button id="previous" type="button" data-aria="previous" data-tip="previous"><i class="chevron" aria-hidden="true"></i></button>
            <button id="today" type="button" data-copy="today" data-tip="thisMonth">今天</button>
            <button id="next" type="button" data-aria="next" data-tip="next"><i class="chevron" aria-hidden="true"></i></button>
            <button id="year-toggle" type="button" aria-controls="year-grid" aria-pressed="false">年览</button>
          </nav>
          <div class="tools">
            <label class="opacity-control" for="transparency"><span data-copy="transparency">透明度</span>
              <input id="transparency" type="range" min="0" max="100" value="75">
              <output id="transparency-value" for="transparency">75%</output>
            </label>
            <button id="settings-toggle" type="button" class="export" aria-expanded="false" aria-controls="settings-menu" data-copy="settings">设置</button>
          </div>
        </div>
        <section id="settings-menu" class="size-menu" data-aria="settings" hidden>
          <div class="settings-title">
            <span data-copy="settings">设置</span>
            <button id="settings-close" type="button" data-aria="closeSettings" data-tip="closeSettings">×</button>
          </div>
          <label class="language-row"><span data-copy="language">语言</span>
            <select id="language"><option value="zh-CN">中文 · 中国大陆</option><option value="en-US">English · United States</option></select>
          </label>
          <label><span data-copy="width">月历宽度</span><input id="size-width" data-setting="width" type="range"><output id="size-width-out" for="size-width"></output></label>
          <label><span data-copy="height">月历高度</span><input id="size-height" data-setting="height" type="range"><output id="size-height-out" for="size-height"></output></label>
          <label><span data-copy="font">字体大小</span><input id="size-font" data-setting="font" type="range" min="11" max="28"><output id="size-font-out" for="size-font"></output></label>
          <label><span data-copy="leading">清单行距</span><input id="size-leading" data-setting="leading" type="range" min="110" max="210" step="5"><output id="size-leading-out" for="size-leading"></output></label>
          <label class="native-only pin-row"><span data-copy="desktopMode">固定在桌面</span><input id="pin-window" type="checkbox" checked></label>
          <a id="holiday-source" target="_blank" rel="noopener noreferrer"></a>
          <p id="calendar-hint" hidden></p>
          <span id="feedback" class="sr-only" role="status"></span>
          <div class="settings-actions">
            <button id="size-reset" data-copy="reset" type="button">恢复默认大小</button>
            <button id="export" type="button" class="export" data-tip="exportHelp">
              <i class="download-icon" aria-hidden="true"></i><span data-copy="export">导出记录</span>
            </button>
          </div>
          <button id="export-illustrated" type="button" data-copy="exportIllustrated" hidden>导出含图片的 HTML</button>
          <button class="native-only quit" id="quit-app" type="button" data-copy="quitApp">退出月历</button>
        </section>
      </header>
      <div class="weekdays" aria-hidden="true">
        <span>周日</span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span>
      </div>
      <div id="days" class="days" role="group" aria-labelledby="month-label"></div>
      <div id="year-grid" class="year-grid" role="group" aria-labelledby="month-label" hidden></div>
      <div class="resize-handle" data-resize="width" data-tip="dragWidth" aria-hidden="true"></div>
      <div class="resize-handle" data-resize="height" data-tip="dragHeight" aria-hidden="true"></div>
      <div class="resize-handle" data-resize="both" data-tip="dragBoth" aria-hidden="true"></div>
    </main>
  </div>
  <div id="window-edges" aria-hidden="true">
    <i data-edge="n"></i>
    <i data-edge="s"></i>
    <i data-edge="e"></i>
    <i data-edge="w"></i>
    <i data-edge="nw"></i>
    <i data-edge="ne"></i>
    <i data-edge="sw"></i>
    <i data-edge="se"></i>
  </div>
  <div id="task-menu" class="task-menu" role="menu" data-aria="taskActions" hidden>
    <button type="button" role="menuitem" data-action="edit" tabindex="-1">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5 4 4M4 20l4.6-1 11-11a2.8 2.8 0 0 0-4-4l-11 11z"/></svg>
      <span data-copy="editTask">编辑</span>
    </button>
    <button type="button" role="menuitem" data-action="delete" tabindex="-1">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12M10 10.5v6M14 10.5v6"/></svg>
      <span data-copy="deleteTask">删除</span>
    </button>
  </div>
  <dialog id="task-note" class="note" data-aria="taskNote" aria-describedby="note-date">
    <form id="note-form">
      <div class="note-meta">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4" width="13" height="13" rx="2.7"/><path d="M6.7 2.7v3M13.3 2.7v3M4 8h12"/></svg>
        <time id="note-date"></time>
      </div>
      <input id="note-title" type="text" data-aria="noteTitle" data-placeholder="noteTitle" autocomplete="off" required>
      <div id="note-document" class="note-document" role="group" data-aria="noteBody">
        <textarea id="note-body" class="note-text" rows="1" data-aria="noteBody" data-placeholder="notePrompt" autofocus></textarea>
      </div>
      <p id="note-message" role="status"></p>
      <div class="note-actions">
        <input id="note-files" type="file" accept="image/*" multiple hidden>
        <button id="add-note-photo" type="button" data-tip="insertPhotoHelp">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.1"/><path d="m4 17 5-5 3.2 3.2 3.7-4.1L20.5 16"/></svg>
          <span data-copy="insertPhoto">插入图片</span>
        </button>
        <button id="note-cancel" type="button" data-copy="cancelNote">取消</button>
        <button id="note-save" class="primary" type="submit" data-copy="saveNote">保存</button>
      </div>
    </form>
  </dialog>
  <dialog id="photo-preview" class="photo-preview" data-aria="viewPhoto">
    <img id="photo-original" alt="">
    <button id="photo-close" type="button" data-aria="closePhoto" autofocus>×</button>
  </dialog>
  <script src="calendar.js"></script>
</body>
</html>
